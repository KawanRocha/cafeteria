<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quer sair comigo?</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #230005; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Camada Corrigida: Papel de Parede Animado 100% em CSS */
        .fundo-animado {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .elemento-fundo {
            position: absolute;
            bottom: -60px;
            font-size: 26px;
            text-shadow: 0 0 10px rgba(255, 77, 109, 0.4);
            animation: subirFundo linear infinite;
            user-select: none;
        }

        /* Definição de trajetórias fixas e nativas para o fundo */
        .elemento-fundo:nth-child(1) { left: 10%; font-size: 30px; animation-duration: 6s; animation-delay: 0s; }
        .elemento-fundo:nth-child(2) { left: 25%; font-size: 22px; animation-duration: 8s; animation-delay: 2s; }
        .elemento-fundo:nth-child(3) { left: 40%; font-size: 28px; animation-duration: 7s; animation-delay: 1s; }
        .elemento-fundo:nth-child(4) { left: 55%; font-size: 24px; animation-duration: 9s; animation-delay: 3s; }
        .elemento-fundo:nth-child(5) { left: 70%; font-size: 32px; animation-duration: 6s; animation-delay: 1.5s; }
        .elemento-fundo:nth-child(6) { left: 85%; font-size: 20px; animation-duration: 8s; animation-delay: 4s; }
        .elemento-fundo:nth-child(7) { left: 15%; font-size: 25px; animation-duration: 7.5s; animation-delay: 3.5s; }
        .elemento-fundo:nth-child(8) { left: 60%; font-size: 29px; animation-duration: 6.5s; animation-delay: 5s; }
        .elemento-fundo:nth-child(9) { left: 80%; font-size: 23px; animation-duration: 8.5s; animation-delay: 0.5s; }

        @keyframes subirFundo {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% { transform: translateY(-115vh) rotate(360deg); opacity: 0; }
        }

        /* Card Principal */
        .container {
            background-color: rgba(255, 255, 255, 0.96);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 90%;
            height: 280px; /* Altura fixa para manter os botões presos dentro dele */
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }

        /* Ajuste de altura do segundo card para caber as opções */
        #card-opcoes {
            height: auto;
            min-height: 340px;
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 20px;
            font-size: 26px;
        }

        .options-container {
            margin: 25px 0;
            text-align: left;
        }

        .option-item {
            margin: 12px 0;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-item input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
            height: 60px;
            position: relative;
        }

        button {
            height: 45px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 0 20px;
            white-space: nowrap;
        }

        /* Botão SIM e ESSE!! em Verde */
        .btn-verde {
            width: 120px;
            background-color: #2a9d8f;
            color: white;
            z-index: 11;
            transition: transform 0.1s ease;
        }

        .btn-verde:hover { transform: scale(1.1); }

        /* Botão NÃO em Vermelho (Fuga Instantânea absoluta em relação ao card) */
        #btn-nao {
            background-color: #e63946;
            color: white;
            z-index: 12;
            min-width: 110px;
            position: absolute;
            bottom: 38px;
            right: 50px;
            transition: top 0.1s ease, left 0.1s ease; /* Deslizamento ultrarrápido anti-clique */
        }

        .escondido { display: none !important; }

        /* Chuva de cliques (Efeito de Sucesso) */
        .coracao-clique {
            position: absolute;
            color: #ff4d6d;
            font-size: 24px;
            pointer-events: none;
            z-index: 20;
            animation: cair linear forwards;
        }

        @keyframes cair {
            0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Papel de Parede com Corações e Rosas Subindo Nativamente -->
    <div class="fundo-animado">
        <div class="elemento-fundo">❤️</div>
        <div class="elemento-fundo">🌹</div>
        <div class="elemento-fundo">💖</div>
        <div class="elemento-fundo">🌹</div>
        <div class="elemento-fundo">💕</div>
        <div class="elemento-fundo">❤️</div>
        <div class="elemento-fundo">🌹</div>
        <div class="elemento-fundo">💖</div>
        <div class="elemento-fundo">🌹</div>
    </div>

    <!-- PARTE 1: O Convite Inicial -->
    <div class="container" id="card-convite">
        <h1>Quer sair comigo? 🌹</h1>
        <div class="btn-container">
            <button class="btn-verde" id="btn-sim" onclick="irParaOpcoes()">SIM!</button>
            <button id="btn-nao">NÃO</button>
        </div>
    </div>

    <!-- PARTE 2: Escolha do Lugar -->
    <div class="container escondido" id="card-opcoes">
        <h1>Sabia que iria aceitar, onde seria bom de irmos para vc? 🥰</h1>
        <div class="options-container">
            <div class="option-item">
                <input type="radio" id="lugar1" name="lugar" value="Cinema" checked>
                <label for="lugar1">🎬 Cinema</label>
            </div>
            <div class="option-item">
                <input type="radio" id="lugar2" name="lugar" value="Passeio no lago">
                <label for="lugar2">🌅 Passeio no lago</label>
            </div>
            <div class="option-item">
                <input type="radio" id="lugar3" name="lugar" value="Cafe ou melhor capuccino">
                <label for="lugar3">☕ Cafe ou melhor capuccino</label>
            </div>
        </div>
        <div class="btn-container">
            <button class="btn-verde" style="width: 140px;" onclick="finalizarEncontro()">Esse!!</button>
        </div>
    </div>

    <!-- PARTE 3: Tela de Sucesso -->
    <div class="container escondido" id="card-sucesso">
        <h2>Eba! Mal posso esperar! ❤️</h2>
        <p id="mensagem-final"></p>
        <p style="font-size: 14px; color: #888; margin-top: 15px;">Redirecionando para o WhatsApp...</p>
    </div>

    <script>
        // SEU NÚMERO DE WHATSAPP AQUI (Apenas números com DDD)
        const SEU_NUMERO_WHATSAPP = '5500000000000'; 

        const btnNao = document.getElementById('btn-nao');
        const cardConvite = document.getElementById('card-convite');
        const cardOpcoes = document.getElementById('card-opcoes');
        const cardSucesso = document.getElementById('card-sucesso');
        const mensagemFinal = document.getElementById('mensagem-final');

        const frasesPersistentes = [
            "Tem certeza?",
            "Não quer considerar?",
            "Dá uma chance?",
            "Pensa com carinho...",
            "Certeza absoluta?",
            "Nem um cafezinho?"
        ];

        // LÓGICA DE FUGA INTRACARD (O botão corre do mouse rastreando os movimentos dentro do card)
        cardConvite.addEventListener('mousemove', (e) => {
            const rectCard = cardConvite.getBoundingClientRect();
            const rectBtn = btnNao.getBoundingClientRect();

            // Posição do mouse em relação ao card
            const mouseX = e.clientX - rectCard.left;
            const mouseY = e.clientY - rectCard.top;

            // Posição do centro do botão em relação ao card
            const btnCentroX = btnNao.offsetLeft + (btnNao.offsetWidth / 2);
            const btnCentroY = btnNao.offsetTop + (btnNao.offsetHeight / 2);

            // Calcula a distância real do mouse até o botão
            const distancia = Math.hypot(mouseX - btnCentroX, mouseY - btnCentroY);

            // Se o mouse chegar a menos de 80 pixels perto do botão, ele foge instantaneamente
            if (distancia < 80) {
                // Define limites rígidos e seguros dentro do próprio container branco
                const xMin = 20;
                const xMax = rectCard.width - btnNao.offsetWidth - 20;
                const yMin = 100; // Mantém abaixo do título principal
                const yMax = rectCard.height - btnNao.offsetHeight - 20;

                // Sorteia a nova posição estritamente restrita à caixa branca
                const novoX = Math.floor(Math.random() * (xMax - xMin)) + xMin;
                const novoY = Math.floor(Math.random() * (yMax - yMin)) + yMin;
