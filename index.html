<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quer sair comigo?</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #1a0003;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Camada do Papel de Parede Animado */
        .fundo-animado {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .elemento-fundo {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            opacity: 0.6;
            animation: subirFundo linear infinite;
        }

        @keyframes subirFundo {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Card Principal */
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 20px;
            font-size: 26px;
        }

        p {
            color: #4a4a4a;
            font-size: 18px;
        }

        .options-container {
            margin: 25px 0;
            text-align: left;
        }

        .option-item {
            margin: 12px 0;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-item input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 30px;
            height: 50px;
            position: relative;
        }

        /* Padronização de tamanho dos botões */
        button {
            height: 45px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.15s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 0 20px;
            white-space: nowrap;
        }

        /* Botões de Ação Positiva em Verde */
        .btn-verde {
            width: 120px;
            background-color: #2a9d8f;
            color: white;
            z-index: 11;
        }

        .btn-verde:hover {
            transform: scale(1.1);
        }

        /* Botão NÃO em Vermelho */
        #btn-nao {
            background-color: #e63946;
            color: white;
            z-index: 12;
            min-width: 110px;
        }

        /* Classes de controle das etapas */
        .escondido {
            display: none !important;
        }

        /* Chuva de cliques (Efeito de Sucesso) */
        .coracao-clique {
            position: absolute;
            color: #ff4d6d;
            font-size: 24px;
            pointer-events: none;
            z-index: 20;
            animation: cair linear forwards;
        }

        @keyframes cair {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="fundo-animado" id="fundo-animado"></div>

    <!-- PARTE 1: O Convite Inicial -->
    <div class="container" id="card-convite">
        <h1>Quer sair comigo? 🌹</h1>
        <div class="btn-container">
            <button class="btn-verde" id="btn-sim" onclick="irParaOpcoes()">SIM!</button>
            <button id="btn-nao" onmouseover="fugir()" onclick="fugir()">NÃO</button>
        </div>
    </div>

    <!-- PARTE 2: Escolha do Lugar -->
    <div class="container escondido" id="card-opcoes">
        <h1>Sabia que iria aceitar, onde seria bom de irmos para vc? 🥰</h1>
        
        <div class="options-container">
            <div class="option-item">
                <input type="radio" id="lugar1" name="lugar" value="Cinema" checked>
                <label for="lugar1">🎬 Cinema</label>
            </div>
            <div class="option-item">
                <input type="radio" id="lugar2" name="lugar" value="Passeio no lago">
                <label for="lugar2">🌅 Passeio no lago</label>
            </div>
            <div class="option-item">
                <input type="radio" id="lugar3" name="lugar" value="Cafe ou melhor capuccino">
                <label for="lugar3">☕ Cafe ou melhor capuccino</label>
            </div>
        </div>

        <div class="btn-container">
            <button class="btn-verde" style="width: 140px;" onclick="finalizarEncontro()">Esse!!</button>
        </div>
    </div>

    <!-- PARTE 3: Tela de Sucesso -->
    <div class="container escondido" id="card-sucesso">
        <h2>Eba! Mal posso esperar! ❤️</h2>
        <p id="mensagem-final"></p>
        <p style="font-size: 14px; color: #888; margin-top: 15px;">Redirecionando para o WhatsApp...</p>
    </div>

    <script>
        // SEU NÚMERO DE WHATSAPP AQUI (Apenas números com DDD)
        const SEU_NUMERO_WHATSAPP = '5500000000000'; 

        const btnNao = document.getElementById('btn-nao');
        const cardConvite = document.getElementById('card-convite');
        const cardOpcoes = document.getElementById('card-opcoes');
        const cardSucesso = document.getElementById('card-sucesso');
        const mensagemFinal = document.getElementById('mensagem-final');
        const fundoAnimado = document.getElementById('fundo-animado');

        const frasesPersistentes = [
            "Tem certeza?",
            "Não quer considerar?",
            "Dá uma chance?",
            "Pensa com carinho...",
            "Certeza absoluta?",
            "Nem um cafezinho?"
        ];

        // Cria o fundo animado
        const elementos = ['❤️', '🌹', '💖', '🌹', '💕'];
        for (let i = 0; i < 40; i++) {
            const el = document.createElement('div');
            el.classList.add('elemento-fundo');
            el.innerText = elementos[Math.floor(Math.random() * elementos.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = Math.random() * 20 + 15 + 'px';
            el.style.animationDuration = Math.random() * 5 + 5 + 's';
            el.style.animationDelay = Math.random() * 5 + 's';
            fundoAnimado.appendChild(el);
        }

        // Fuga estritamente limitada ao redor do card central
        function fugir() {
            // Posiciona em relação à janela, mas usando margens próximas ao centro
            const centroX = window.innerWidth / 2;
            const centroY = window.innerHeight / 2;

            // Define uma área muito menor (raio máximo de 100px para os lados e 60px para cima/baixo)
            // Isso força o botão a flutuar colado ao redor do container branco central
            const limiteRaioX = 90; 
            const limiteRaioY = 60; 

            const novoX = centroX + (Math.random() * (limiteRaioX * 2) - limiteRaioX) - (btnNao.offsetWidth / 2);
            const novoY = centroY + (Math.random() * (limiteRaioY * 2) - limiteRaioY) - (btnNao.offsetHeight / 2);

            btnNao.style.position = 'fixed';
            btnNao.style.left = novoX + 'px';
            btnNao.style.top = novoY + 'px';

            let fraseAleatoria;
            do {
                fraseAleatoria = frasesPersistentes[Math.floor(Math.random() * frasesPersistentes.length)];
            } while (fraseAleatoria === btnNao.innerText);

            btnNao.innerText = fraseAleatoria;
        }

        function irParaOpcoes() {
            cardConvite.classList.add('escondido');
            cardOpcoes.classList.remove('escondido');
        }

        function finalizarEncontro() {
            const localSelecionado = document.querySelector('input[name="lugar"]:checked').value;
            
            cardOpcoes.classList.add('escondido');
            cardSucesso.classList.remove('escondido');
            
            mensagemFinal.innerText = `Combinado! Nosso encontro está confirmado para: ${localSelecionado}.`;

            criarChuvaDeCoracoes();
            enviarWhatsApp(localSelecionado);
        }

        function criarChuvaDeCoracoes() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const coracao = document.createElement('div');
                    coracao.classList.add('coracao-clique');
                    coracao.innerText = '❤️';
                    coracao.style.left = Math.random() * 100 + 'vw';
                    coracao.style.fontSize = Math.random() * 20 + 20 + 'px';
                    coracao.style.animationDuration = Math.random() * 2 + 1.5 + 's';
                    document.body.appendChild(coracao);

                    setTimeout(() => { coracao.remove(); }, 3000);
                }, i * 80);
            }
        }
