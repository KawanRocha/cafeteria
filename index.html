<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quer sair comigo?</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: #1a0003;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* Camada do Papel de Parede Animado */
        .fundo-animado {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .elemento-fundo {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            opacity: 0.6;
            animation: subirFundo linear infinite;
        }

        @keyframes subirFundo {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Card Principal */
        .container {
            background-color: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            box-sizing: border-box;
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 20px;
        }

        p {
            color: #4a4a4a;
            font-size: 18px;
        }

        .options-container {
            margin: 20px 0;
            text-align: left;
        }

        .option-item {
            margin: 10px 0;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            height: 50px;
            position: relative;
        }

        /* Padronização de tamanho dos botões */
        button {
            width: 110px;
            height: 45px;
            font-size: 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Botão SIM em Verde */
        #btn-sim {
            background-color: #2a9d8f;
            color: white;
            z-index: 11;
        }

        #btn-sim:hover {
            transform: scale(1.1);
        }

        /* Botão NÃO em Vermelho */
        #btn-nao {
            background-color: #e63946;
            color: white;
            z-index: 12;
        }

        .sucesso {
            display: none;
        }

        .sucesso h2 {
            color: #2a9d8f;
        }

        /* Chuva de cliques (Efeito de Sucesso) */
        .coracao-clique {
            position: absolute;
            color: #ff4d6d;
            font-size: 24px;
            pointer-events: none;
            z-index: 20;
            animation: cair linear forwards;
        }

        @keyframes cair {
            0% {
                transform: translateY(-50px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="fundo-animado" id="fundo-animado"></div>

    <div class="container" id="card-principal">
        <h1>Quer sair comigo? 🌹</h1>
        <p>Escolha um dos lugares abaixo para o nosso encontro:</p>
        
        <div class="options-container">
            <div class="option-item">
                <input type="radio" id="lugar1" name="lugar" value="Jantar num restaurante japonês" checked>
                <label for="lugar1">🍣 Jantar japonês</label>
            </div>
            <div class="option-item">
                <input type="radio" id="lugar2" name="lugar" value="Ir ao cinema e comer pipoca">
                <label for="lugar2">🎬 Cinema e pipoca</label>
            </div>
            <div class="option-item">
                <input type="radio" id="lugar3" name="lugar" value="Tomar um café e comer um doce">
                <label for="lugar3">☕ Café e um doce</label>
            </div>
        </div>

        <div class="btn-container">
            <button id="btn-sim" onclick="aceitou()">SIM!</button>
            <button id="btn-nao" onmouseover="fugir()" onclick="fugir()">NÃO</button>
        </div>
    </div>

    <div class="container sucesso" id="card-sucesso">
        <h2>Eba! Mal posso esperar! 🥰</h2>
        <p id="mensagem-final"></p>
        <p style="font-size: 14px; color: #888;">Redirecionando para o WhatsApp...</p>
    </div>

    <script>
        // SEU NÚMERO DE WHATSAPP AQUI (Apenas números com DDD)
        const SEU_NUMERO_WHATSAPP = '5500000000000'; 

        const btnNao = document.getElementById('btn-nao');
        const cardPrincipal = document.getElementById('card-principal');
        const cardSucesso = document.getElementById('card-sucesso');
        const mensagemFinal = document.getElementById('mensagem-final');
        const fundoAnimado = document.getElementById('fundo-animado');

        // Cria o papel de parede com corações e rosas subindo continuamente
        const elementos = ['❤️', '🌹', '💖', '🌹', '💕'];
        for (let i = 0; i < 40; i++) {
            const el = document.createElement('div');
            el.classList.add('elemento-fundo');
            el.innerText = elementos[Math.floor(Math.random() * elementos.length)];
            el.style.left = Math.random() * 100 + 'vw';
            el.style.fontSize = Math.random() * 20 + 15 + 'px';
            el.style.animationDuration = Math.random() * 5 + 5 + 's';
            el.style.animationDelay = Math.random() * 5 + 's';
            fundoAnimado.appendChild(el);
        }

        // Nova função de fuga controlada perto do centro
        function fugir() {
            // Pega o centro exato da tela atual
            const centroX = window.innerWidth / 2;
            const centroY = window.innerHeight / 2;

            // Define um raio máximo de distância do centro (ex: 200px para os lados, 250px para cima/baixo)
            // Isso força o botão a "orbitar" o quadrado branco sem nunca ir para os cantos da tela
            const limiteRaioX = 180;
            const limiteRaioY = 220;

            // Gera uma nova coordenada restrita ao redor do centro
            const novoX = centroX + (Math.random() * (limiteRaioX * 2) - limiteRaioX) - (btnNao.offsetWidth / 2);
            const novoY = centroY + (Math.random() * (limiteRaioY * 2) - limiteRaioY) - (btnNao.offsetHeight / 2);

            btnNao.style.position = 'fixed';
            btnNao.style.left = novoX + 'px';
            btnNao.style.top = novoY + 'px';
        }

        function aceitou() {
            const localSelecionado = document.querySelector('input[name="lugar"]:checked').value;
            
            cardPrincipal.style.display = 'none';
            cardSucesso.style.display = 'block';
            
            mensagemFinal.innerText = `Combinado! Nosso encontro está confirmado para: ${localSelecionado}.`;

            criarChuvaDeCoracoes();
            enviarWhatsApp(localSelecionado);
        }

        function criarChuvaDeCoracoes() {
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const coracao = document.createElement('div');
                    coracao.classList.add('coracao-clique');
                    coracao.innerText = '❤️';
                    coracao.style.left = Math.random() * 100 + 'vw';
                    coracao.style.fontSize = Math.random() * 20 + 20 + 'px';
                    coracao.style.animationDuration = Math.random() * 2 + 1.5 + 's';
                    document.body.appendChild(coracao);

                    setTimeout(() => { coracao.remove(); }, 3000);
                }, i * 80);
            }
        }

        function enviarWhatsApp(local) {
            const textoMensagem = `Oi! Eu aceitei o seu convite! 🥰 Nosso encontro está confirmado para: ${local}.`;
            const mensagemFormatada = encodeURIComponent(textoMensagem);
            const urlWhatsApp = `https://wa.me{SEU_NUMERO_WHATSAPP}?text=${mensagemFormatada}`;

            setTimeout(() => {
                window.location.href = urlWhatsApp;
            }, 2500);
        }
    </script>
</body>
</html>
