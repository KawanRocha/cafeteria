<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quer sair comigo?</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            font-size: 12px;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            font-size: 12px;
            background-color: #1a0003;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Fundo animado */
        .fundo-animado {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .elemento-fundo {
            position: absolute;
            bottom: -50px;
            font-size: 12px;
            animation: subir 8s linear infinite;
            opacity: 0.8;
        }

        .elemento-fundo:nth-child(1) {
            left: 5%;
            animation-delay: 0s;
        }

        .elemento-fundo:nth-child(2) {
            left: 15%;
            animation-delay: 2s;
        }

        .elemento-fundo:nth-child(3) {
            left: 25%;
            animation-delay: 4s;
        }

        .elemento-fundo:nth-child(4) {
            left: 35%;
            animation-delay: 1s;
        }

        .elemento-fundo:nth-child(5) {
            left: 45%;
            animation-delay: 3s;
        }

        .elemento-fundo:nth-child(6) {
            left: 55%;
            animation-delay: 5s;
        }

        .elemento-fundo:nth-child(7) {
            left: 65%;
            animation-delay: 1.5s;
        }

        .elemento-fundo:nth-child(8) {
            left: 75%;
            animation-delay: 3.5s;
        }

        .elemento-fundo:nth-child(9) {
            left: 85%;
            animation-delay: 2.5s;
        }

        .elemento-fundo:nth-child(10) {
            left: 95%;
            animation-delay: 4.5s;
        }

        .elemento-fundo:nth-child(11) {
            left: 20%;
            animation-delay: 6s;
        }

        .elemento-fundo:nth-child(12) {
            left: 70%;
            animation-delay: 6.5s;
        }

        .elemento-fundo:nth-child(13) {
            left: 50%;
            animation-delay: 7s;
        }

        @keyframes subir {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Cartões */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            min-height: 220px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        #card-opcoes {
            min-height: 340px;
        }

        h1 {
            color: #ff4d6d;
            margin-bottom: 30px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
        }

        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 60px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-family: Arial, sans-serif;
            font-size: 12px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .btn-verde {
            background-color: #2a9d8f;
            color: white;
            width: 120px;
        }

        .btn-verde:hover {
            transform: scale(1.08);
        }

        #btn-nao {
            background-color: #e63946;
            color: white;
            min-width: 110px;
            position: relative;
            z-index: 20;
            transition:
                left 0.15s ease,
                top 0.15s ease;
        }

        #btn-nao:hover {
            transform: scale(1.05);
        }

        .opcao {
            display: block;
            margin: 15px 0;
            padding: 15px;
            border: 2px solid #ff4d6d;
            border-radius: 12px;
            cursor: pointer;
            font-family: Arial, sans-serif;
            font-size: 12px;
            transition: 0.2s;
        }

        .opcao:hover {
            background-color: #ffe5eb;
        }

        .opcao input {
            margin-right: 10px;
        }

        .btn-finalizar {
            margin-top: 20px;
            background-color: #ff4d6d;
            color: white;
            width: 100%;
        }

        .btn-finalizar:hover {
            transform: scale(1.03);
        }

        .escondido {
            display: none !important;
        }

        #mensagem-final {
            color: #ff4d6d;
            font-family: Arial, sans-serif;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Fundo -->
    <div class="fundo-animado">
        <div class="elemento-fundo">❤️</div>
        <div class="elemento-fundo">🌹</div>
        <div class="elemento-fundo">💖</div>
        <div class="elemento-fundo">💕</div>
        <div class="elemento-fundo">❤️</div>
        <div class="elemento-fundo">🌹</div>
        <div class="elemento-fundo">💖</div>
        <div class="elemento-fundo">💕</div>
        <div class="elemento-fundo">❤️</div>
        <div class="elemento-fundo">🌹</div>
        <div class="elemento-fundo">💖</div>
        <div class="elemento-fundo">💕</div>
        <div class="elemento-fundo">❤️</div>
    </div>

    <!-- Primeiro cartão -->
    <div class="container" id="card-convite">

        <h1 id="titulo-convite">
            Quer sair comigo?
        </h1>

        <div class="btn-container">

            <button
                class="btn-verde"
                id="btn-sim"
                onclick="irParaOpcoes()">
                SIM!
            </button>

            <button
                id="btn-nao"
                onmouseenter="fugirPelaTela()">
                NÃO
            </button>

        </div>
    </div>

    <!-- Cartão das opções -->
    <div
        class="container escondido"
        id="card-opcoes">

        <h1>
            Então escolha nosso encontro 🥰
        </h1>

        <label class="opcao">
            <input
                type="radio"
                name="lugar"
                value="Cinema">
            🎬 Cinema
        </label>

        <label class="opcao">
            <input
                type="radio"
                name="lugar"
                value="Passeio no lago">
            🌅 Passeio no lago
        </label>

        <label class="opcao">
            <input
                type="radio"
                name="lugar"
                value="Cafe ou melhor capuccino">
            ☕ Cafe ou melhor capuccino
        </label>

        <button
            class="btn-finalizar"
            onclick="finalizarEncontro()">
            Esse!!
        </button>

    </div>

    <!-- Cartão final -->
    <div
        class="container escondido"
        id="card-sucesso">

        <h1>
            Eba! Mal posso esperar! ❤️
        </h1>

        <p id="mensagem-final"></p>

    </div>


    <script>

        const btnNao =
            document.getElementById("btn-nao");

        const cardConvite =
            document.getElementById("card-convite");

        const cardOpcoes =
            document.getElementById("card-opcoes");

        const cardSucesso =
            document.getElementById("card-sucesso");

        const mensagemFinal =
            document.getElementById("mensagem-final");

        const tituloConvite =
            document.getElementById("titulo-convite");


        /* Frases do botão NÃO */

        const frasesNao = [
            "Da uma chance",
            "Tem certeza?",
            "Voce nao vai se arrepender"
        ];

        let indiceFrase = 0;


        /* Botão NÃO fugindo */

        function fugirPelaTela() {

            btnNao.style.position = "fixed";

            const larguraBotao =
                btnNao.offsetWidth;

            const alturaBotao =
                btnNao.offsetHeight;


            // Centro da tela

            const centroX =
                window.innerWidth / 2;

            const centroY =
                window.innerHeight / 2;


            /*
             * Área de movimentação.
             *
             * Quanto menores os valores,
             * mais perto do centro ele fica.
             */

            const raioX = 100;
            const raioY = 70;


            const card =
                cardConvite.getBoundingClientRect();


            const margem = 15;


            let novoX;
            let novoY;


            /*
             * Procura uma posição aleatória
             * que não fique sobre o cartão.
             */

            for (
                let tentativa = 0;
                tentativa < 50;
                tentativa++
            ) {

                novoX =
                    centroX -
                    larguraBotao / 2 +
                    (Math.random() * 2 - 1) * raioX;


                novoY =
                    centroY -
                    alturaBotao / 2 +
                    (Math.random() * 2 - 1) * raioY;


                const sobreCard =
                    novoX < card.right + margem &&
                    novoX + larguraBotao >
                        card.left - margem &&
                    novoY < card.bottom + margem &&
                    novoY + alturaBotao >
                        card.top - margem;


                if (!sobreCard) {
                    break;
                }
            }


            /*
             * Mantém o botão dentro da tela.
             */

            novoX = Math.max(
                10,
                Math.min(
                    novoX,
                    window.innerWidth -
                        larguraBotao -
                        10
                )
            );


            novoY = Math.max(
                10,
                Math.min(
                    novoY,
                    window.innerHeight -
                        alturaBotao -
                        10
                )
            );


            btnNao.style.left =
                novoX + "px";

            btnNao.style.top =
                novoY + "px";


            /*
             * Troca a frase do botão.
             */

            btnNao.innerText =
                frasesNao[indiceFrase];


            indiceFrase++;


            if (
                indiceFrase >=
                frasesNao.length
            ) {

                indiceFrase = 0;
            }
        }


        /* Quando clicar em SIM */

        function irParaOpcoes() {

            tituloConvite.innerText =
                "Nossa achei que iria clicar no não Rs";


            const botoes =
                cardConvite.querySelector(
                    ".btn-container"
                );


            botoes.classList.add(
                "escondido"
            );


            setTimeout(function () {

                cardConvite.classList.add(
                    "escondido"
                );

                cardOpcoes.classList.remove(
                    "escondido"
                );

            }, 2000);
        }


        /* Finalizar escolha */

        function finalizarEncontro() {

            const lugarSelecionado =
                document.querySelector(
                    'input[name="lugar"]:checked'
                );


            if (!lugarSelecionado) {

                alert(
                    "Escolha um lugar primeiro 🥰"
                );

                return;
            }


            const lugar =
                lugarSelecionado.value;


            mensagemFinal.innerText =
                "Então está decidido: " +
                lugar +
                "! 🥰";


            cardOpcoes.classList.add(
                "escondido"
            );


            cardSucesso.classList.remove(
                "escondido"
            );


            /*
             * Coloque aqui seu número do WhatsApp.
             */

            const SEU_NUMERO_WHATSAPP =
                "5500000000000";


            const mensagem =
                "Oi! Eu escolhi " +
                lugar +
                " para nosso encontro 🥰❤️";


            const linkWhatsApp =
                "https://wa.me/" +
                SEU_NUMERO_WHATSAPP +
                "?text=" +
                encodeURIComponent(
                    mensagem
                );


            setTimeout(function () {

                window.location.href =
                    linkWhatsApp;

            }, 2000);
        }

    </script>

</body>

</html>
